<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrafficSense Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #0f172a;
        }
    </style>
</head>

<body class="text-white">

<!-- LOGIN -->
<div id="loginPage" class="h-screen flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-xl shadow-lg w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">🚦 TrafficSense</h1>

        <input id="tokenInput"
               placeholder="Enter Admin Token"
               class="w-full p-2 mb-4 rounded bg-slate-700 border border-slate-600">

        <button onclick="login()"
                class="w-full bg-blue-500 hover:bg-blue-600 p-2 rounded">
            Login
        </button>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden p-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">🚦 TrafficSense Dashboard</h1>

        <button onclick="loadViolations()"
                class="bg-green-500 px-4 py-2 rounded hover:bg-green-600">
            Refresh
        </button>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-800 p-4 rounded">
            <p>Total Violations</p>
            <h2 id="totalCount" class="text-2xl font-bold">0</h2>
        </div>

        <div class="bg-slate-800 p-4 rounded">
            <p>Cars</p>
            <h2 id="carCount" class="text-2xl font-bold">0</h2>
        </div>

        <div class="bg-slate-800 p-4 rounded">
            <p>Cameras</p>
            <h2 id="camCount" class="text-2xl font-bold">0</h2>
        </div>
    </div>

    <!-- TABLE -->
    <div class="bg-slate-800 p-4 rounded overflow-auto">
        <table class="w-full text-left">
            <thead>
                <tr class="border-b border-slate-600">
                    <th>ID</th>
                    <th>Time</th>
                    <th>Vehicle</th>
                    <th>Speed</th>
                    <th>Camera</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>
    let TOKEN = "";

    function login() {
        TOKEN = document.getElementById("tokenInput").value;

        if (!TOKEN) {
            alert("Enter token");
            return;
        }

        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");

        loadViolations();
    }

    async function loadViolations() {
        const table = document.getElementById("tableBody");

        // ✅ Loading state
        table.innerHTML = `<tr><td colspan="6" class="text-center py-4">Loading...</td></tr>`;

        try {
            const res = await fetch("http://127.0.0.1:8000/violations", {
                headers: {
                    "Authorization": "Bearer " + TOKEN
                }
            });

            const allData = await res.json();

            // 🔥 LIMIT DATA (prevents lag)
            const data = allData.slice(0, 30);

            let carCount = 0;
            let cams = new Set();

            // 🔥 FAST RENDERING (string buffer)
            let rows = "";

            data.forEach(v => {
                if (v.vehicle_type === "car") carCount++;
                cams.add(v.camera_id);

                // 🔥 FIX IMAGE PATH
                let imgUrl = `http://127.0.0.1:8000/${v.image_path}`;

                rows += `
                    <tr class="border-b border-slate-700 hover:bg-slate-700">
                        <td>${v.id}</td>
                        <td>${v.time}</td>
                        <td>${v.vehicle_type}</td>
                        <td class="text-red-400 font-bold">${v.speed}</td>
                        <td>${v.camera_id}</td>
                        <td>
                            <img src="${imgUrl}"
                                 onerror="this.src='https://via.placeholder.com/80?text=No+Image'"
                                 class="w-20 rounded border border-slate-600">
                        </td>
                    </tr>
                `;
            });

            table.innerHTML = rows;

            document.getElementById("totalCount").innerText = data.length;
            document.getElementById("carCount").innerText = carCount;
            document.getElementById("camCount").innerText = cams.size;

        } catch (err) {
            console.error(err);
            table.innerHTML = `<tr><td colspan="6" class="text-center text-red-400">Backend error</td></tr>`;
        }
    }

    // 🔥 AUTO REFRESH EVERY 5 SEC (VERY IMPRESSIVE)
    setInterval(() => {
        if (TOKEN) loadViolations();
    }, 5000);
</script>

</body>
</html>
